name: Sincronización de datos

# Llama al endpoint de sincronización del sitio desplegado (noticias + Fórmula 1).
# Secrets necesarios en GitHub: SITE_URL (ej: https://motor-nacional.vercel.app) y CRON_SECRET.
on:
  schedule:
    - cron: "17 */2 * * *" # cada 2 horas
  workflow_dispatch:
    inputs:
      only:
        description: "Qué sincronizar (news, f1 o vacío para todo)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a /api/cron/sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Faltan los secrets SITE_URL y/o CRON_SECRET"; exit 1
          fi
          URL="${SITE_URL%/}/api/cron/sync"
          if [ -n "$ONLY" ]; then URL="$URL?only=$ONLY"; fi
          STATUS=$(curl -sS -o response.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$URL")
          cat response.json; echo
          if [ "$STATUS" -ge 400 ]; then echo "::error::HTTP $STATUS"; exit 1; fi
